<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lärarrummet</title><link rel="icon" href="/ikon.png">
<style>
:root{--bg:#f4f5fb;--kort:#fff;--text:#1c2340;--muted:#5f6585;--acc:#3949ab;--acc-bg:#3949ab;--rand:#dfe2f0;--ok:#2e7d32;--fel:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#141726;--kort:#1f2338;--text:#e8eaf6;--muted:#9aa0bf;--acc:#8c98d8;--acc-bg:#3949ab;--rand:#2e3352;--fel:#ef9a9a;--ok:#81c784}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--acc-bg);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;flex:1}
nav{padding:10px 20px;background:var(--kort);border-bottom:1px solid var(--rand);font-weight:700;font-size:16px}
.meny-knapp{margin-left:auto;background:rgba(255,255,255,.2);color:inherit;border:none;border-radius:16px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.meny-bak{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.25)}
.meny{position:fixed;top:58px;right:10px;z-index:21;display:flex;flex-direction:column;background:var(--kort);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:auto;max-height:calc(100vh - 80px);min-width:240px}
.meny .meny-grupp{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;border-top:1px solid var(--rand)}
.meny button.under{padding:10px 18px 10px 34px;font-size:14px}
.snabb{display:flex;flex-wrap:wrap;gap:8px}.snabb button{flex:1 1 150px}
.meny button{background:none;border:none;text-align:left;padding:12px 18px;font-size:15px;color:var(--text);cursor:pointer}.meny button:hover{background:var(--bg)}.meny button.vald{font-weight:700;color:var(--acc)}
main{max-width:1000px;margin:auto;padding:16px}
.kort{background:var(--kort);border:1px solid var(--rand);border-radius:14px;padding:16px;margin-bottom:14px}
a{color:var(--acc)}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}
input,textarea,select{font:inherit;padding:8px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
textarea{min-height:90px}label{display:block;margin:8px 0 2px;font-size:14px}
button.p{background:var(--acc-bg);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-size:15px;cursor:pointer;margin-top:10px}
button.m{background:none;border:1px solid var(--rand);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--rand);font-size:14px;vertical-align:top}
.adress{font-size:30px;font-weight:800;letter-spacing:1px}.qr{width:180px;height:180px;background:#fff;padding:6px;border-radius:10px}
.flex{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:14px;background:var(--rand);border-radius:7px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#e53935,#ff7043)}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:auto}
.dagar{display:flex;gap:10px;flex-wrap:wrap}.dagar label{display:flex;gap:4px;align-items:center;margin:0}.dagar input{width:auto}
.msg{padding:10px;border-radius:9px;margin-bottom:12px}.msg.fel{background:#ffebee;color:#b71c1c}.msg.ok{background:#e8f5e9;color:#1b5e20}
.grupp{border-left:4px solid var(--acc);padding-left:10px;margin:10px 0}
.staplar{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0 2px}.staplar div{flex:1;background:var(--acc-bg);border-radius:4px 4px 0 0;min-height:2px}
.staplar-txt{display:flex;gap:6px}.staplar-txt span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.mini-bar{display:inline-block;width:70px;height:8px;background:var(--rand);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini-bar i{display:block;height:100%;background:var(--acc-bg)}
.fil-rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.fil-rad input{width:auto}
tr.klick{cursor:pointer}tr.klick:hover td{background:var(--bg)}td input{padding:5px}.res-in{width:80px}
.pamin{background:#fff8e1;color:#5d4037;border-radius:9px;padding:8px 10px;font-size:13px;margin:0 0 10px;line-height:1.4}.regler li{margin:8px 0;line-height:1.45}
.beh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 12px;margin:6px 0}.beh-rad{margin-top:6px}.m.vald{background:var(--acc-bg);color:#fff}
h3{font-size:16px;margin:0 0 6px}.badge{background:#c62828;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.rutor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.ruta{background:var(--bg);border-radius:12px;padding:12px}.ruta-r{font-size:13px;color:var(--muted)}.ruta-v{font-size:28px;font-weight:800;margin:2px 0}.ruta-u{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}.legend span{display:flex;align-items:center;gap:6px}
.lg-bar{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--acc-bg)}.lg-line{display:inline-block;width:16px;height:2px;background:var(--text)}
.vd-yta{position:relative;height:150px;display:flex;gap:6px;align-items:flex-end;margin-left:20px;border-bottom:1px solid var(--rand)}
.vd-grid{position:absolute;left:0;right:0;border-top:1px dashed var(--rand)}.vd-grid span{position:absolute;left:-20px;top:-8px;font-size:11px;color:var(--muted)}
.vd-kol{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
.vd-bar{width:70%;max-width:40px;background:var(--acc-bg);border-radius:4px 4px 0 0;min-height:2px}
.vd-snitt{position:absolute;left:8%;right:8%;height:2px;background:var(--text);box-shadow:0 0 0 2px var(--kort)}
.vd-x{display:flex;gap:6px;margin-left:20px}.vd-x span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
.lb{display:flex;flex-direction:column;gap:6px}.lb-rad{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px}
.lb-rad.klick{cursor:pointer}.lb-rad.klick:hover .lb-namn{text-decoration:underline}.lb-namn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-spar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.lb-spar i{display:block;height:100%;background:var(--acc-bg);border-radius:0 4px 4px 0}
.lb-v{font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}a.m{text-decoration:none;display:inline-block}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--text);color:var(--kort);font-size:13px;padding:6px 9px;border-radius:8px;max-width:280px;display:none}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><img src="/ikon.png" width="32" height="32" alt=""><h1 id="rubrik">Lärarrummet</h1><span id="ver" class="small"></span><button class="meny-knapp" id="meny-knapp" title="Meny">☰ Meny</button></header>
<nav id="nav"></nav><main id="main"></main>
<script>
// Samma menysystem som i Läxspelet: ☰ Meny öppnar en lista i grupper
// Grupper som fälls ut (undermenyer), så att läraren inte ser alla val på en gång. Rätt grupp är öppen från början.
const MENY = [[null, ["oversikt"]], ["📚 Hemarbete", ["laxor", "prov", "extra", "veckobrev"]], [null, ["material"]],
  ["👩‍🎓 Eleverna", ["statistik", "studieteknik", "rapporter", "foraldrar"]], ["👥 Klassen", ["grupper", "klasslag"]],
  ["🏫 Skolan", ["skolan", "behorighet", "regler"]], ["⚙️ Övrigt", ["komigang", "historik", "inst"]]];
const MENY_RATT = { laxor: "veckobrev", veckobrev: "veckobrev", prov: "material", extra: "veckobrev", material: "material", statistik: "statistik", studieteknik: "studieteknik",
  rapporter: "rapport", foraldrar: "lapp", grupper: "grupper", klasslag: "klasslag" };
let menyOppen = false, menyFalld = null;
// Hovra (eller tryck) på en stapel för att se siffrorna
document.addEventListener("pointerover", (ev) => { const m = ev.target.closest?.("[data-tip]"); const tip = document.getElementById("tip") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "tip" }));
  if (!m) { tip.style.display = "none"; return; } tip.textContent = m.dataset.tip; tip.style.display = "block"; });
document.addEventListener("pointermove", (ev) => { const tip = document.getElementById("tip"); if (tip?.style.display === "block") { tip.style.left = Math.min(ev.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (ev.clientY + 14) + "px"; } });
const flikar = [["oversikt", "🏫 Översikt"], ["statistik", "📈 Statistik"], ["studieteknik", "🧠 Studieteknik"], ["laxor", "📖 Läxor"], ["prov", "📝 Prov"], ["extra", "🎯 Extraarbete och ikapp"], ["veckobrev", "📬 Veckobrev"], ["material", "📎 Material, schema och riktlinjer"], ["grupper", "👥 Grupper"], ["klasslag", "🐲 Klasslag"], ["rapporter", "📊 Rapporter"], ["foraldrar", "✉️ Från föräldrar"], ["historik", "📜 Historik"], ["skolan", "🏫 Skolan"], ["behorighet", "🔐 Behörighet"], ["regler", "📘 Så gör du rätt"], ["komigang", "📘 Kom igång"], ["inst", "⚙️ Inställningar"]];
let valdElev = null, valtProv = null, filer = {}, forraFlik = "oversikt";
const VD = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
let L = null, flik = location.hash.slice(1) || "oversikt", msg = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (s) => document.querySelector(s);
async function ladda() {
  // tillbaka från inloggningen med skolkontot
  const q = new URLSearchParams(location.search);
  if (q.has("skolkonto") || q.has("skolkonto_fel")) {
    flik = "inst";
    msg = q.has("skolkonto_fel") ? { t: "fel", x: q.get("skolkonto_fel") } : { t: "ok", x: "✔ Du är verifierad med skolkontot. Föräldrarna ser det vid nästa synk." };
    history.replaceState(null, "", "/#inst");
  }
  if (q.has("tillsyn") || q.has("tillsyn_fel")) {
    flik = "skolan";
    msg = q.has("tillsyn_fel") ? { t: "fel", x: q.get("tillsyn_fel") } : { t: "ok", x: TS_KLAR[q.get("tillsyn")] || "✔ Klart." };
    history.replaceState(null, "", "/#skolan");
  }
  L = await (await fetch("/api/lage")).json(); rita();
}
// Tillsynsloggen: bekräfta med en ny inloggning med skol- eller organisationskontot
async function bekrafta(body) {
  const r = await fetch("/api/tillsyn_bekrafta", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.url) { location.href = j.url; return; }
  if (r.ok && j.klar) { msg = { t: "ok", x: TS_KLAR[body.typ] }; await ladda(); return; }
  msg = { t: "fel", x: j.fel || "Det gick inte." }; rita();
}
const TS_KLAR = { begar: "✔ Bekräftat med skolkontot. Begäran är skickad till kontrollanten.", svar: "✔ Bekräftat med skolkontot. Rektorn får svaret vid nästa synk." };
async function uppdatera(body, ok) {
  const r = await fetch("/api/uppdatering", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) msg = { t: "fel", x: j.fel || "Det gick inte." }; else { L.uppdatering = j; msg = ok ? { t: "ok", x: ok } : null; }
  rita();
}
// Ny version: en rad överst på alla sidor
function uppdRad() {
  const u = L.uppdatering, w = L.windows;
  const brand = w && w.windows && !w.brandvagg ? `<div class="msg">ℹ️ Vill du att eleverna ansluter från mobilen på lektionen? Då behöver Windows brandvägg öppnas för appen (en gång). <button class="m" id="u-brand">🔓 Öppna brandväggen</button><div class="small">Kräver administratör. Det behövs inte om föräldrarna skickar klasslänken till dig (📧 på Översikten).</div></div>` : "";
  const klar = u?.uppdaterad ? `<div class="msg ok">✅ Lärarrummet är uppdaterad till version ${esc(u.uppdaterad.till)}. <button class="m" id="u-ok">OK</button></div>` : "";
  const sk = L.skolkonto?.fornya ? `<div class="msg">⏳ Din verifiering med skolkontot behöver förnyas. Se ⚙️ Inställningar.</div>` : "";
  return brand + klar + sk + uppdRad2(u);
}
function uppdRad2(u) {
  if (!u?.ny) return "";
  if (u.steg) return `<div class="msg ok">⏳ ${u.steg === "laddar" ? "Laddar ner" : "Installerar"} version ${esc(u.senaste)}… Appen startar om själv om en liten stund.</div>`;
  return `<div class="msg ok">🆕 Version ${esc(u.senaste)} av Lärarrummet finns. ${u.lage === "automatisk" ? "Den installeras automatiskt när appen inte används, eller nu: " : ""}
    ${u.kan_installera ? `<button class="m" id="u-nu">⬇️ Uppdatera nu</button>` : `<a href="${esc(u.sida)}" target="_blank">Ladda ner</a>`}</div>`;
}
async function andra(body, ok) {
  const r = await fetch("/api/andra", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { msg = { t: "fel", x: j.fel || "Det gick inte." }; } else { L = { ...j, uppdatering: j.uppdatering ?? L.uppdatering }; msg = ok ? { t: "ok", x: ok } : null; }
  rita();
  return r.ok;
}
// Tillgänglighet (WCAG 2.1 AA): koppla varje etikett till sitt fält och ge fält utan etikett ett namn.
function tillganglig(rot = document) {
  const FALT = "input,select,textarea";
  rot.querySelectorAll("label:not([for])").forEach((l) => {
    if (l.querySelector(FALT)) return;
    const f = l.nextElementSibling;
    if (!f || !f.matches(FALT)) return;
    if (!f.id) f.id = "f-" + Math.random().toString(36).slice(2, 9);
    l.htmlFor = f.id;
  });
  rot.querySelectorAll(FALT).forEach((f) => {
    if (f.type === "hidden" || f.labels?.length || f.getAttribute("aria-label") || f.getAttribute("aria-labelledby") || f.title) return;
    let namn = "";
    const syskon = f.nextElementSibling;
    if ((f.type === "checkbox" || f.type === "radio") && syskon && syskon.tagName === "SPAN") namn = syskon.textContent;
    if (!namn && f.placeholder) namn = f.placeholder;
    if (!namn) { const fore = f.previousElementSibling; if (fore && !fore.matches(FALT) && fore.textContent.trim().length < 80) namn = fore.textContent; }
    for (let el = f.parentElement; !namn && el && el !== document.body; el = el.parentElement) { const h = el.querySelector("h2,h3"); if (h) namn = h.textContent; }
    if (!namn && f.type === "file") namn = "Välj fil";
    if (namn) f.setAttribute("aria-label", namn.replace(/\s+/g, " ").trim());
  });
}
if (typeof MutationObserver !== "undefined") new MutationObserver(() => tillganglig()).observe(document.documentElement, { childList: true, subtree: true });
function rita() {
  $("#ver").textContent = "v" + L.version;
  $("#rubrik").textContent = L.klass ? `Lärarrummet · ${L.klass}` : "Lärarrummet";
  const namn = Object.fromEntries(flikar);
  if (flik === "elev" && !valdElev) flik = "oversikt";
  $("#nav").textContent = flik === "elev" ? `👤 ${(L.elever.find((x) => x.id === valdElev) || {}).namn || "Elev"}` : namn[flik] || namn.oversikt;
  document.querySelector(".meny-bak")?.remove(); document.querySelector(".meny")?.remove();
  if (menyFalld === null) menyFalld = (MENY.find(([r, ids]) => r && ids.includes(flik)) || [null])[0];
  const menyVal = (id, under) => { const last = MENY_RATT[id] && lasRatt(MENY_RATT[id]);
    return `<button class="${id === flik ? "vald" : ""}${under ? " under" : ""}" data-f="${id}" ${id === flik ? 'aria-current="page"' : ""}${last ? ` title="Kräver nivå ${nivaFor(MENY_RATT[id])}"` : ""}>${namn[id]}${last ? " 🔒" : ""}${id === "skolan" && L.skola?.olasta ? ` (${L.skola.olasta})` : ""}</button>`; };
  if (menyOppen) document.body.insertAdjacentHTML("beforeend", `<div class="meny-bak"></div><nav class="meny" aria-label="Meny">${MENY.map(([rubrik, ids]) => !rubrik ? ids.map((id) => menyVal(id)).join("")
    : `<button class="meny-grupp" data-mg="${esc(rubrik)}" aria-expanded="${menyFalld === rubrik}">${rubrik}<span aria-hidden="true">${menyFalld === rubrik ? "▾" : "▸"}</span></button>`
      + (menyFalld === rubrik ? ids.map((id) => menyVal(id, true)).join("") : "")).join("")}</nav>`);
  document.querySelectorAll("[data-mg]").forEach((b) => b.onclick = () => { menyFalld = menyFalld === b.dataset.mg ? "" : b.dataset.mg; rita(); document.querySelector(`[data-mg="${CSS.escape(b.dataset.mg)}"]`)?.focus(); });
  $("#meny-knapp").textContent = `☰ Meny${L.skola?.olasta ? ` (${L.skola.olasta})` : ""}`;
  $("#meny-knapp").onclick = () => { menyOppen = !menyOppen; rita(); };
  const bak = document.querySelector(".meny-bak"); if (bak) bak.onclick = () => { menyOppen = false; rita(); };
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { flik = b.dataset.f; location.hash = flik; msg = null; menyOppen = false; menyFalld = null; rita(); window.scrollTo(0, 0); });
  if ((!L.intro_klar || !L.regler_last) && flik !== "regler") { $("#main").innerHTML = (msg ? `<div class="msg ${msg.t}">${esc(msg.x)}</div>` : "") + intro(); koppla(); return; }
  if (rektorVantar || (L.ar_rektor && !L.rektor_kvitterat)) { $("#main").innerHTML = (msg ? `<div class="msg ${msg.t}">${esc(msg.x)}</div>` : "") + rektorIntro(); koppla(); return; }
  $("#main").innerHTML = uppdRad() + (msg ? `<div class="msg ${msg.t}">${esc(msg.x)}</div>` : "") + ({ oversikt, statistik, elev, studieteknik, laxor, extra, veckobrev, prov, material, grupper, klasslag, rapporter, foraldrar, skolan, behorighet, regler, historik, inst, komigang }[flik] || oversikt)();
  koppla();
}
const lasRatt = (k) => !(L.behorighet?.ratt || []).includes(k);
const nivaFor = (k) => (L.behorighet?.rattigheter?.[k] || [0])[0];
const lasText = (k) => `🔒 Kräver nivå ${nivaFor(k)}. ${L.skola?.rektor ? `Rektorn (${esc(L.skola.rektor.namn)}) bestämmer.` : "Utan beslut från en rektor gäller nivå 0."} Se 🔐 Behörighet.`;
const av = (k) => lasRatt(k) ? `<div class="msg fel">${lasText(k)}</div>` : L.inst[k] ? "" : `<div class="msg fel">Den här funktionen är avstängd. Slå på den under ⚙️ Inställningar.</div>`;
function snabbval() {
  return `<div class="kort"><h2>Vad vill du göra?</h2><div class="snabb">
    <button class="p" data-f="laxor">📖 Ny läxa</button><button class="p" data-f="prov">📝 Nytt prov</button>
    <button class="p" data-f="extra">🎯 Extrauppgift</button><button class="p" data-f="veckobrev">📬 Veckobrev</button></div></div>`;
}
function oversikt() {
  const f = (e) => Object.entries(e.foralder || {}).filter(([, v]) => v).map(([k]) => ({ veckobrev: "📬", rapport: "📊", klasslag: "🏫", mejl: "📧", grupper: "👥", statistik: "📈", material: "📎", schema: "🗓️", studieteknik: "🧠", riktlinjer: "📝", lapp: "✉️", samtal: "🗣️" })[k]).join(" ");
  return `${snabbval()}<div class="kort flex"><img class="qr" src="/api/qr.svg" alt="QR-kod">
    <div>${L.skola ? `<p class="small muted">🏫 ${esc(L.skola.namn)} · ${L.roll === "amne" ? `ämneslärare${L.amne ? ` i ${esc(L.amne)}` : ""}` : `mentor${L.klass ? ` för ${esc(L.klass)}` : ""}`}</p>` : ""}<h2>Eleverna ansluter här</h2><div class="adress">${esc(L.adress)}</div>
    <p class="muted">Eleverna ska vara på samma wifi som datorn. I Läxspelet trycker de <b>🤝 Plugga ihop → 🏫 Anslut till läraren</b> och skriver adressen.
    Nästa gång räcker <b>🔄 Synka med läraren</b>.</p><p class="small muted">Föräldern bestämmer också: en funktion fungerar bara när både du och föräldern har slagit på den.</p></div></div>
  <div class="kort"><h2>Elever (${L.elever.length})</h2>
    ${L.elever.length ? `<table><tr><th>Namn</th><th>Senast synkad</th><th>Föräldern har slagit på</th><th></th></tr>

// Gör stora foton mindre innan de laddas upp (telefonbilder är ofta 5–10 MB).
async function krymp(fil) {
  if (!fil.type.startsWith("image/") || fil.size < 1500000) return fil;
  const bild = await createImageBitmap(fil);
  const s = Math.min(1, 2000 / Math.max(bild.width, bild.height));
  const c = Object.assign(document.createElement("canvas"), { width: Math.round(bild.width * s), height: Math.round(bild.height * s) });
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  return new File([blob], fil.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function laddaUpp(id, input) {

  const j = await r.json();
  if (!r.ok) msg = { t: "fel", x: j.fel || "Det gick inte att ladda upp." };
  else { filer[id] = j; msg = null; }
  rita();
}

function provKrockar(lista) {
