<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Läxspelet Lärare</title><link rel="icon" href="/ikon.png">
<style>
:root{--bg:#f4f5fb;--kort:#fff;--text:#1c2340;--muted:#6b7190;--acc:#3949ab;--rand:#dfe2f0;--ok:#2e7d32;--fel:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#141726;--kort:#1f2338;--text:#e8eaf6;--muted:#9aa0bf;--acc:#7986cb;--rand:#2e3352}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--acc);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:var(--kort);border-bottom:1px solid var(--rand)}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-size:15px;color:var(--text);cursor:pointer}
nav button.vald{background:var(--acc);color:#fff}
main{max-width:1000px;margin:auto;padding:16px}
.kort{background:var(--kort);border:1px solid var(--rand);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}
input,textarea,select{font:inherit;padding:8px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
textarea{min-height:90px}label{display:block;margin:8px 0 2px;font-size:14px}
button.p{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-size:15px;cursor:pointer;margin-top:10px}
button.m{background:none;border:1px solid var(--rand);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--rand);font-size:14px;vertical-align:top}
.adress{font-size:30px;font-weight:800;letter-spacing:1px}.qr{width:180px;height:180px;background:#fff;padding:6px;border-radius:10px}
.flex{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:14px;background:var(--rand);border-radius:7px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#e53935,#ff7043)}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:auto}
.dagar{display:flex;gap:10px;flex-wrap:wrap}.dagar label{display:flex;gap:4px;align-items:center;margin:0}.dagar input{width:auto}
.msg{padding:10px;border-radius:9px;margin-bottom:12px}.msg.fel{background:#ffebee;color:var(--fel)}.msg.ok{background:#e8f5e9;color:var(--ok)}
.grupp{border-left:4px solid var(--acc);padding-left:10px;margin:10px 0}
.staplar{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0 2px}.staplar div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.staplar-txt{display:flex;gap:6px}.staplar-txt span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.mini-bar{display:inline-block;width:70px;height:8px;background:var(--rand);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini-bar i{display:block;height:100%;background:var(--acc)}
.fil-rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.fil-rad input{width:auto}
tr.klick{cursor:pointer}tr.klick:hover td{background:var(--bg)}td input{padding:5px}.res-in{width:80px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><img src="/ikon.png" width="32" height="32" alt=""><h1 id="rubrik">Läxspelet Lärare</h1><span id="ver" class="small"></span></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const flikar = [["oversikt", "🏫 Översikt"], ["statistik", "📈 Statistik"], ["studieteknik", "🧠 Studieteknik"], ["veckobrev", "📬 Veckobrev"], ["prov", "📝 Prov"], ["material", "📎 Material"], ["grupper", "👥 Grupper"], ["klasslag", "🐲 Klasslag"], ["rapporter", "📊 Rapporter"], ["historik", "📜 Historik"], ["inst", "⚙️ Inställningar"]];
let valdElev = null, valtProv = null, filer = {};
const VD = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
let L = null, flik = location.hash.slice(1) || "oversikt", msg = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (s) => document.querySelector(s);
async function ladda() { L = await (await fetch("/api/lage")).json(); rita(); }
async function andra(body, ok) {
  const r = await fetch("/api/andra", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { msg = { t: "fel", x: j.fel || "Det gick inte." }; } else { L = j; msg = ok ? { t: "ok", x: ok } : null; }
  rita();
  return r.ok;
}
function rita() {
  $("#ver").textContent = "v" + L.version;
  $("#rubrik").textContent = L.klass ? `Läxspelet Lärare · ${L.klass}` : "Läxspelet Lärare";
  $("#nav").innerHTML = flikar.map(([id, t]) => `<button class="${id === flik ? "vald" : ""}" data-f="${id}">${t}</button>`).join("");
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { flik = b.dataset.f; location.hash = flik; msg = null; rita(); });
  $("#main").innerHTML = (msg ? `<div class="msg ${msg.t}">${esc(msg.x)}</div>` : "") + ({ oversikt, statistik, studieteknik, veckobrev, prov, material, grupper, klasslag, rapporter, historik, inst }[flik] || oversikt)();
  koppla();
}
const av = (k) => L.inst[k] ? "" : `<div class="msg fel">Den här funktionen är avstängd. Slå på den under ⚙️ Inställningar.</div>`;
function oversikt() {
  const f = (e) => Object.entries(e.foralder || {}).filter(([, v]) => v).map(([k]) => ({ veckobrev: "📬", rapport: "📊", klasslag: "🏫", mejl: "📧", grupper: "👥", statistik: "📈", material: "📎", schema: "🗓️", studieteknik: "🧠", riktlinjer: "📝" })[k]).join(" ");
  return `<div class="kort flex"><img class="qr" src="/api/qr.svg" alt="QR-kod">
    <div><h2>Eleverna ansluter här</h2><div class="adress">${esc(L.adress)}</div>
    <p class="muted">Eleverna ska vara på samma wifi som datorn. I Läxspelet trycker de <b>🤝 Plugga ihop → 🏫 Anslut till läraren</b> och skriver adressen.
    Nästa gång räcker <b>🔄 Synka med läraren</b>.</p><p class="small muted">Föräldern bestämmer också: en funktion fungerar bara när både du och föräldern har slagit på den.</p></div></div>
  <div class="kort"><h2>Elever (${L.elever.length})</h2>
    ${L.elever.length ? `<table><tr><th>Namn</th><th>Senast synkad</th><th>Föräldern har slagit på</th><th></th></tr>
    ${L.elever.map((e) => `<tr><td><b>${esc(e.namn)}</b>${e.fel ? `<div class="small" style="color:var(--fel)">⚠️ ${esc(e.fel)}</div>` : ""}</td><td>${esc(e.senast || "–")}</td><td>${f(e) || "<span class='muted'>inget</span>"}</td>
      <td>${e.har_schema ? `<a class="m" href="/schema/${encodeURIComponent(e.id)}" target="_blank" title="Digitalt schema, sök och skriv ut">🗓️</a> ` : ""}<button class="m" data-synka="${e.id}">🔄</button> <button class="m" data-bort="${e.id}">🗑️</button></td></tr>`).join("")}</table>
    <button class="p" id="synka-alla">🔄 Synka alla</button>` : `<p class="muted">Inga elever har anslutit än.</p>`}</div>`;
}
function veckobrev() {
  return `${av("veckobrev")}<div class="kort"><h2>Nytt veckobrev</h2>
    <p class="small muted">Veckobrevet hamnar i föräldrarnas inkorg när eleven synkar. Föräldern godkänner innan läxorna läggs in.</p>
    <div class="grid2"><div><label>Rubrik</label><input id="vb-titel" placeholder="Veckobrev v.${L.boss?.vecka?.slice(-2) || ""}"></div>
      <div><label>Vecka</label><input id="vb-vecka" placeholder="t.ex. 2026-W48"></div></div>
    <h3>📖 Läsläxa</h3><div class="grid2"><div><label>Kapitel (nummer)</label><input id="vb-kap" type="number"></div><div><label>Kapitlets namn</label><input id="vb-kapnamn"></div></div>
    <label>Läsdagar</label><div class="dagar">${VD.slice(0, 5).map((d, i) => `<label><input type="checkbox" data-las="${i}"> ${d}</label>`).join("")}</div>
    <div class="chk"><input type="checkbox" id="vb-hogl"> <span>Läses högt för en vuxen</span></div>
    <label>Läxboken lämnas in</label><select id="vb-skriv"><option value="">Ingen</option>${VD.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
    <h3>📝 Ord och glosor</h3>
    <label>Stavningsord (ett per rad)</label><textarea id="vb-ord"></textarea>
    <label>Glosor med översättning (ett par per rad: <i>hund = dog</i>)</label><textarea id="vb-glosor"></textarea>
    <div class="grid2"><div><label>Från språk</label><input id="vb-fran" value="Svenska"></div><div><label>Till språk</label><input id="vb-till" value="Engelska"></div></div>
    <label>Förhör/diktamen</label><select id="vb-dikt"><option value="">Inget</option>${VD.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
    <label>Instruktioner (en per rad)</label><textarea id="vb-regler"></textarea>
    <label>Övrigt till föräldrarna</label><input id="vb-note">
    <h3>📎 Har du redan brevet som PDF eller foto?</h3>
    <p class="small muted">Bifoga det. Föräldern får brevet, och familjens Läxspelet läser det och fyller i läxorna du inte skrev ovan. Du kan alltså bara bifoga brevet och ge det en rubrik.</p>
    ${filVal("vb")}
    <button class="p" id="vb-skicka">📬 Lägg ut veckobrevet</button></div>
  <div class="kort"><h2>Utlagda veckobrev</h2>${L.veckobrev.length ? `<table>${L.veckobrev.map((b) => `<tr><td><b>${esc(b.titel)}</b>${b.fil ? ` ${filLank(b.fil)}` : ""}<div class="small muted">v.${esc(b.vecka)} · ${esc(b.skapad)}</div></td><td>${(b.ai.ord || []).length} ord</td><td class="small">${fatt(L.veckobrev_fatt?.[b.id])}</td><td><button class="m" data-vb-bort="${b.id}">🗑️</button></td></tr>`).join("")}</table>` : `<p class="muted">Inga än.</p>`}</div>`;
}
const filLank = (f) => `<a href="/api/fil/${esc(f.namn)}" target="_blank">${f.mime === "application/pdf" ? "📄" : "🖼️"} ${esc(f.orig || "fil")}</a>`;
const fatt = (n) => n?.length ? `✅ Har kommit fram till ${n.length}: <span class="muted">${n.map(esc).join(", ")}</span>` : `<span class="muted">⏳ Skickas när eleverna synkar</span>`;
function filVal(id) {
  const f = filer[id];
  return `<div class="fil-rad"><input type="file" id="${id}-fil" accept="application/pdf,image/*">${f ? `<span>✅ ${filLank(f)} <button class="m" data-fil-bort="${id}">✖</button></span>` : `<span class="small muted">PDF eller foto, högst 8 MB</span>`}</div>`;
}
// Gör stora foton mindre innan de laddas upp (telefonbilder är ofta 5–10 MB).
async function krymp(fil) {
  if (!fil.type.startsWith("image/") || fil.size < 1500000) return fil;
  const bild = await createImageBitmap(fil);
  const s = Math.min(1, 2000 / Math.max(bild.width, bild.height));
  const c = Object.assign(document.createElement("canvas"), { width: Math.round(bild.width * s), height: Math.round(bild.height * s) });
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  return new File([blob], fil.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function laddaUpp(id, input) {
  const fil = input.files[0];
  if (!fil) return;
  const fd = new FormData();
  fd.append("fil", await krymp(fil));
  const r = await fetch("/api/fil", { method: "POST", body: fd });
  const j = await r.json();
  if (!r.ok) msg = { t: "fel", x: j.fel || "Det gick inte att ladda upp." };
  else { filer[id] = j; msg = null; }
  rita();
}
function statistik() {
  if (!L.inst.statistik) return av("statistik");
  const med = L.elever.filter((e) => e.statistik);
  const utan = L.elever.filter((e) => !e.statistik);
  const snitt = (s) => { const f = s.forhor || []; const n = f.reduce((a, x) => a + x.n, 0); return n ? Math.round(f.reduce((a, x) => a + x.ratt, 0) / n * 100) : null; };
  const sista = (s) => (s.per_vecka || []).slice(-1)[0]?.dagar ?? 0;
  const fyra = (s) => (s.per_vecka || []).slice(-4).reduce((a, x) => a + x.dagar, 0);
  if (valdElev) {
    const e = L.elever.find((x) => x.id === valdElev);
    if (e?.statistik) {
      const s = e.statistik, pv = s.per_vecka || [];
      return `<div class="kort"><button class="m" id="st-tillbaka">← Hela klassen</button>
        <h2 style="margin-top:12px">📈 ${esc(e.namn)}</h2><p class="small muted">${esc(s.fran)} – ${esc(s.till)} · synkad ${esc(e.senast)}</p>
        <b>Dagar med plugg per vecka</b>
        <div class="staplar">${pv.map((v) => `<div style="height:${Math.max(2, v.dagar / 7 * 100)}%" title="${v.dagar} dagar"></div>`).join("")}</div>
        <div class="staplar-txt">${pv.map((v) => `<span>v.${esc(v.vecka.slice(-2))}<br>${v.dagar}</span>`).join("")}</div></div>
      <div class="kort"><h2>Förhör</h2>${(s.forhor || []).length ? `<table><tr><th>Datum</th><th>Förhör</th><th>Rätt</th></tr>${s.forhor.slice().reverse().map((f) => `<tr><td>${esc(f.datum)}</td><td>${esc(f.namn)}</td><td><span class="mini-bar"><i style="width:${f.n ? f.ratt / f.n * 100 : 0}%"></i></span>${f.ratt} av ${f.n}</td></tr>`).join("")}</table>` : `<p class="muted">Inga förhör de senaste veckorna.</p>`}</div>
      <div class="kort"><h2>Prov</h2>${(s.prov || []).length ? `<table>${s.prov.slice().reverse().map((p) => `<tr><td>${esc(p.datum)}</td><td>${esc(p.namn)}<div class="small muted">${esc(p.amne)}</div></td><td>${"max" in p ? `${p.poang} av ${p.max}` : `betyg ${esc(p.betyg)}`}</td></tr>`).join("")}</table>` : `<p class="muted">Inga provresultat de senaste veckorna.</p>`}</div>
      <div class="kort"><h2>Ämnen hen har övat</h2>${(s.amnen || []).length ? s.amnen.map((a) => `<div>${esc(a.namn)}: <b>${a.dagar}</b> dagar</div>`).join("") : `<p class="muted">Inget än.</p>`}</div>`;
    }
    valdElev = null;
  }
  const alla = med.map((e) => e.statistik);
  const klassSnitt = alla.length ? (alla.reduce((a, s) => a + fyra(s), 0) / alla.length / 4).toFixed(1) : "–";
  return `<div class="kort"><h2>📈 Hur klassen pluggar</h2>
    <p class="small muted">Bara elever vars förälder har slagit på statistik syns här. Tryck på en elev för att se mer. Siffrorna kommer när eleverna synkar.</p>
    <p>Snitt: <b>${klassSnitt}</b> dagar med plugg per vecka (senaste 4 veckorna) · ${med.length} av ${L.elever.length} elever delar statistik</p>
    ${med.length ? `<table><tr><th>Elev</th><th>Den här veckan</th><th>Senaste 4 veckorna</th><th>Förhör, rätt</th><th>Senaste prov</th></tr>
    ${med.map((e) => { const s = e.statistik, p = snitt(s), pr = (s.prov || []).slice(-1)[0];
      return `<tr class="klick" data-elev="${e.id}"><td><b>${esc(e.namn)}</b></td><td>${sista(s)} dagar</td><td><span class="mini-bar"><i style="width:${fyra(s) / 28 * 100}%"></i></span>${fyra(s)} dagar</td>
        <td>${p === null ? "<span class='muted'>–</span>" : `${p} %`}</td><td>${pr ? `${esc(pr.namn)}: ${"max" in pr ? `${pr.poang}/${pr.max}` : esc(pr.betyg)}` : "<span class='muted'>–</span>"}</td></tr>`; }).join("")}</table>` : `<p class="muted">Ingen elev delar statistik än.</p>`}
    ${utan.length ? `<p class="small muted">Delar inte statistik: ${utan.map((e) => esc(e.namn)).join(", ")}</p>` : ""}</div>`;
}
function prov() {
  if (!L.inst.material) return av("material");
  const lista = L.material.filter((m) => m.typ === "prov");
  const p = valtProv && lista.find((m) => m.id === valtProv);
  if (p) {
    return `<div class="kort"><button class="m" id="pr-tillbaka">← Alla prov</button>
      <h2 style="margin-top:12px">📝 ${esc(p.titel)}</h2><p class="small muted">${esc(p.amne)}${p.datum ? ` · ${esc(p.datum)}` : ""}${p.max ? ` · max ${p.max} poäng` : ""}${p.fil ? ` · ${filLank(p.fil)}` : ""}</p>
      <p class="small muted">Skriv in resultatet och tryck 💾. Det skickas bara till den elevens förälder, som godkänner innan det läggs in.</p>
      <table><tr><th>Elev</th><th>${p.max ? "Poäng" : "Betyg"}</th><th>Kommentar</th><th></th><th></th></tr>
      ${L.elever.map((e) => { const r = p.resultat?.[e.id] || {}, ok = (e.foralder || {}).material;
        return `<tr><td><b>${esc(e.namn)}</b>${ok ? "" : `<div class="small muted">förälder har inte slagit på 📎</div>`}</td>
          <td>${p.max ? `<input class="res-in" type="number" step="0.5" min="0" max="${p.max}" data-res-po="${e.id}" value="${r.poang ?? ""}">` : `<select class="res-in" data-res-be="${e.id}"><option></option>${["A", "B", "C", "D", "E", "F"].map((b) => `<option ${r.betyg === b ? "selected" : ""}>${b}</option>`).join("")}</select>`}</td>
          <td><input data-res-ko="${e.id}" value="${esc(r.kommentar || "")}" placeholder="t.ex. Bra jobbat med uppgift 3!"></td>
          <td><button class="m" data-res-spara="${e.id}">💾</button></td><td class="small">${p.fatt.includes(e.namn) ? "✅ framme" : r.ver !== undefined ? "⏳" : ""}</td></tr>`; }).join("")}</table></div>`;
  }
  return `<div class="kort"><h2>Nytt prov</h2>
    <p class="small muted">Lägg in provet, sedan resultatet för varje elev. Bifoga gärna provet eller facit som PDF/foto, så kan eleven titta på det hemma.</p>
    <div class="grid2"><div><label>Provets namn</label><input id="pr-titel" placeholder="t.ex. Vikingatiden"></div><div><label>Ämne</label><input id="pr-amne" placeholder="t.ex. SO"></div></div>
    <div class="grid2"><div><label>Datum</label><input id="pr-datum" type="date"></div><div><label>Maxpoäng (tomt = betyg A–F)</label><input id="pr-max" type="number" min="1"></div></div>
    <label>Till föräldrarna (valfritt)</label><input id="pr-text" placeholder="t.ex. Provet handlade om kapitel 4–6">
    ${filVal("pr")}
    <button class="p" id="pr-ny">➕ Lägg in provet</button></div>
  <div class="kort"><h2>Prov</h2>${lista.length ? `<table>${lista.map((m) => { const n = Object.keys(m.resultat || {}).length;
    return `<tr class="klick" data-prov="${m.id}"><td><b>${esc(m.titel)}</b><div class="small muted">${esc(m.amne)}${m.datum ? ` · ${esc(m.datum)}` : ""}</div></td><td>${n} av ${L.elever.length} resultat</td><td class="small">${m.fatt.length} framme</td>
      <td><button class="m" data-mat-bort="${m.id}">🗑️</button></td></tr>`; }).join("")}</table>` : `<p class="muted">Inga prov än.</p>`}</div>`;
}
function studieteknik() {
  if (!L.inst.studieteknik && !L.inst.riktlinjer) return av("studieteknik");
  const med = L.elever.filter((e) => e.studieteknik);
  const elevval = L.elever.map((e) => `<label class="chk"><input type="checkbox" data-rl-till="${e.id}"> ${esc(e.namn)}</label>`).join("");
  const skickade = L.material.filter((m) => m.typ === "riktlinje");
  const OMR = { tecken: "Tecken", stor: "Stor bokstav", mellanrum: "Mellanrum", stycken: "Stycken", struktur: "Början/slut", ordval: "Ordval", meningar: "Variation" };
  const elev = (e) => { const t = e.studieteknik; return `<details class="kort"><summary><b>${esc(e.namn)}</b> <span class="small muted">· ${t.planer.length} pluggplaner · ${t.svaga_punkter.reduce((a, x) => a + x.antal, 0)} svaga punkter</span></summary>
    <p class="small"><b>Så pluggar eleven (elevens egna svar):</b> ${esc(t.profil)}</p>
    ${t.ai_tankar ? `<p><b>🧠 AI:ns tankar om studietekniken:</b> ${esc(t.ai_tankar)}</p>` : ""}
    ${t.svart?.length ? `<p><b>Verkar svårt:</b> ${t.svart.map(esc).join("; ")}</p>` : ""}
    ${t.svaga_punkter.length ? `<p class="small"><b>Svaga punkter per ämne:</b> ${t.svaga_punkter.map((x) => `${esc(x.amne)} (${x.antal})`).join(", ")}</p>` : ""}
    ${t.planer.length ? `<p class="small"><b>Pluggplaner:</b></p><ul class="small">${t.planer.map((p) => `<li><b>${esc(p.prov)}</b> (${esc(p.amne || "")}, ${esc(p.datum || "")}): ${esc(p.sammanfattning)}</li>`).join("")}</ul>` : ""}
    ${Object.keys(t.skrivande || {}).length ? `<p class="small"><b>Skrivande (0–100):</b> ${Object.entries(t.skrivande).map(([k, v]) => `${OMR[k] || k} ${v}`).join(" · ")}</p>` : ""}
    ${t.riktlinjer?.length ? `<p class="small"><b>Riktlinjer AI:n följer:</b> ${t.riktlinjer.map((x) => `${esc(x.amne)}: ”${esc(x.text)}” ${x.kalla === "larare" ? "(från dig)" : "(från föräldern)"}`).join("; ")}</p>` : ""}</details>`; };
  return `${L.inst.riktlinjer ? `<div class="kort"><h2>📝 Riktlinjer till AI-hjälpläraren</h2>
      <p class="small muted">Elevens AI (hjälplärare, pluggplaner, övningsprov och skrivfeedback) följer dina riktlinjer och säger aldrig emot dig. T.ex. ”Vi räknar bråk med tallinje”, ”Använd begreppen från kapitel 3”, ”Ge ledtrådar, inte svar”. Föräldern godkänner först.</p>
      <div class="grid2"><div><label>Ämne</label><input id="rl-amne" placeholder="t.ex. Matte (tomt = alla ämnen)"></div></div>
      <label>Riktlinje</label><textarea id="rl-text" rows="3" maxlength="600" placeholder="Vad ska AI:n tänka på?"></textarea>
      <details><summary class="small">Bara till vissa elever (annars hela klassen)</summary>${elevval || "<p class='muted'>Inga elever än.</p>"}</details>
      <button class="p" id="rl-ny">📝 Skicka riktlinjen</button>
      ${skickade.length ? `<table>${skickade.map((m) => `<tr><td><b>${esc(m.amne || "Alla ämnen")}</b>: ${esc(m.text)}<div class="small muted">${esc(m.skapad)}${m.till?.length ? ` · till ${m.till.length} elever` : " · hela klassen"}</div></td><td class="small">${fatt(m.fatt)}</td><td><button class="m" data-mat-bort="${m.id}">🗑️</button></td></tr>`).join("")}</table>` : ""}</div>` : ""}
    ${L.inst.studieteknik ? `<div class="kort"><h2>🧠 Elevernas studieteknik</h2><p class="small muted">Bara elever vars förälder har slagit på det syns här. Uppdateras när eleverna synkar. Inga poäng eller jämförelser.</p></div>
      ${med.length ? med.map(elev).join("") : `<p class="muted">Ingen elev delar sin studieteknik än.</p>`}` : ""}`;
}
function material() {
  if (!L.inst.material) return av("material");
  const lista = L.material.filter((m) => m.typ === "material" || m.typ === "schema");
  const elevval = L.elever.map((e) => `<label class="chk"><input type="checkbox" data-mt-till="${e.id}"> ${esc(e.namn)}</label>`).join("");
  return `<div class="kort"><h2>Skicka studiematerial</h2>
    <p class="small muted">T.ex. en sammanfattning, ett arbetsblad eller sidor ur boken. Föräldern godkänner, och sedan ligger det i ämnet i elevens Läxspelet.</p>
    <div class="grid2"><div><label>Rubrik</label><input id="mt-titel" placeholder="t.ex. Sammanfattning vikingatiden"></div><div><label>Ämne</label><input id="mt-amne" placeholder="t.ex. SO"></div></div>
    <label>Till eleverna (valfritt)</label><input id="mt-text" placeholder="t.ex. Läs inför provet på fredag">
    ${filVal("mt")}
    <details><summary class="small">Bara till vissa elever (annars hela klassen)</summary>${elevval || "<p class='muted'>Inga elever än.</p>"}</details>
    <label class="chk"><input type="checkbox" id="mt-schema"> 🗓️ Det här är klassens schema (Läxspelet läser av lektioner och ämnen åt eleven)</label>
    <button class="p" id="mt-ny">📎 Skicka</button></div>
  <div class="kort"><h2>Skickat material</h2>${lista.length ? `<table>${lista.map((m) => `<tr><td>${m.typ === "schema" ? "🗓️ " : ""}<b>${esc(m.titel)}</b> ${m.fil ? filLank(m.fil) : ""}<div class="small muted">${esc(m.amne)} · ${esc(m.skapad)}${m.till?.length ? ` · till ${m.till.length} elever` : " · hela klassen"}</div></td>
    <td class="small">${fatt(m.fatt)}</td><td><button class="m" data-mat-bort="${m.id}">🗑️</button></td></tr>`).join("")}</table>` : `<p class="muted">Inget än.</p>`}</div>`;
}
function grupper() {
  const elevval = L.elever.map((e) => `<label class="chk"><input type="checkbox" data-gm="${e.id}"> ${esc(e.namn)}</label>`).join("");
  const grupp = (g, aktiv) => `<div class="grupp"><b>${esc(g.namn)}</b> · ${g.namn_lista.map(esc).join(", ")}
    <div>${esc(g.uppgift) || "<span class='muted'>Ingen uppgift</span>"}${g.datum ? ` <span class="small muted">· klar senast ${esc(g.datum)}</span>` : ""}</div>
    <div class="small muted">Skapad ${esc(g.skapad)}${g.avslutad ? ` · avslutad ${esc(g.avslutad)}` : ""} · klara: ${g.klara_namn.map(esc).join(", ") || "ingen än"}</div>
    ${aktiv ? `<button class="m" data-g-avsluta="${g.id}">✔️ Avsluta gruppen</button>` : ""}</div>`;
  return `${av("grupper")}<div class="kort"><h2>Dela klassen i grupper</h2>
    <p class="small muted">Grupperna är tillfälliga. Eleverna ser sin grupp och uppgiften i Läxspelet när de synkar, och kan markera uppgiften som klar. Allt sparas i 📜 Historik.</p>
    <label>Gruppuppgift</label><textarea id="g-uppgift" placeholder="t.ex. Gör en affisch om vikingatiden"></textarea>
    <label>Klar senast</label><input id="g-datum" type="date">
    <div class="grid2"><div><label>Dela slumpvis i antal grupper</label><input id="g-antal" type="number" min="1" value="4"><button class="p" id="g-dela">🎲 Dela slumpvis</button></div>
    <div><label>…eller välj elever själv</label><input id="g-namn" placeholder="Gruppens namn">${elevval || "<p class='muted'>Inga elever än.</p>"}<button class="p" id="g-ny">➕ Skapa grupp</button></div></div></div>
  <div class="kort"><h2>Aktiva grupper</h2>${L.grupper.length ? L.grupper.map((g) => grupp(g, true)).join("") : `<p class="muted">Inga aktiva grupper.</p>`}</div>
  ${L.gamla_grupper.length ? `<div class="kort"><h2>Tidigare grupper</h2>${L.gamla_grupper.map((g) => grupp(g, false)).join("")}</div>` : ""}`;
}
function klasslag() {
  const b = L.boss;
  if (!b) return av("klasslag");
  const kvar = b.hp - b.skada;
  return `<div class="kort"><h2>${esc(b.ikon)} Veckans klassboss: ${esc(b.boss)}</h2>
    <div class="bar"><div style="width:${Math.round(kvar / b.hp * 100)}%"></div></div>
    <p>${b.klar ? "🎉 Besegrad! Alla som är med får 30 ⭐ nästa gång de synkar." : `❤️ ${kvar} av ${b.hp} kvar`} · ${b.antal} elever med</p>
    <p class="small muted">Du ser bara klassens summa, aldrig vad en enskild elev har pluggat. Elevernas plugg räknas när de synkar.</p></div>
  <div class="kort"><h2>Klassens plugg i klassrummet</h2><p class="small muted">Alla elever har inte Läxspelet. Lägg till poäng för det klassen gör tillsammans, så kan alla vara med. Den här veckan: ${b.extra}.</p>
    <div class="flex"><input id="kp-poang" type="number" min="1" value="20" style="width:120px"><button class="p" id="kp-lagg">➕ Lägg till</button></div></div>`;
}
function rapporter() {
  if (!L.inst.rapport) return av("rapport");
  const r = L.elever.filter((e) => e.rapport);
  return `<div class="kort"><h2>Senaste rapporterna</h2><p class="small muted">Föräldern väljer om rapporten skickas. Alla rapporter sparas i 📜 Historik.</p>
    ${r.length ? r.map((e) => `<div class="grupp"><b>${esc(e.namn)}</b> <span class="small muted">${esc(e.rapport.fran)} – ${esc(e.rapport.till)}</span><ul>${e.rapport.rader.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") : `<p class="muted">Inga rapporter än.</p>`}</div>`;
}
function historik() {
  const ik = { synk: "🔄", rapport: "📊", grupp: "👥", veckobrev: "📬", klasslag: "🐲", anteckning: "📝", prov: "📝", material: "📎" };
  return `<div class="kort"><h2>Anteckning</h2><textarea id="h-text" placeholder="t.ex. Grupparbetet gick bra, grupp 2 behöver mer tid"></textarea><button class="p" id="h-spara">📝 Spara anteckning</button></div>
  <div class="kort"><h2>Historik</h2><p class="small muted">Allt som har hänt: grupper, uppgifter, rapporter, veckobrev och anteckningar. <a href="/api/historik.csv">⬇️ Ladda ner som Excel-fil (CSV)</a></p>
    <label>Sök</label><input id="h-sok" placeholder="t.ex. ett namn eller en grupp">
    <table id="h-tabell">${L.historik.map((h) => `<tr><td class="small" style="white-space:nowrap">${esc(h.tid)}</td><td>${ik[h.typ] || "•"}</td><td>${esc(h.text)}</td></tr>`).join("")}</table></div>`;
}
function inst() {
  return `<div class="kort"><h2>Klassen</h2><div class="grid2"><div><label>Klassens namn</label><input id="i-klass" value="${esc(L.klass)}" placeholder="t.ex. 4B"></div>
    <div><label>Ditt namn (det föräldrarna ser)</label><input id="i-larare" value="${esc(L.larare)}"></div></div><button class="p" id="i-spara">💾 Spara</button></div>
  <div class="kort"><h2>Vad ska vara på?</h2><p class="small muted">Varje funktion fungerar bara när både du och elevens förälder har slagit på den.</p>
    ${Object.entries(L.funktioner).map(([k, t]) => `<div class="chk"><input type="checkbox" data-inst="${k}" ${L.inst[k] ? "checked" : ""}> <span>${esc(t)}</span></div>`).join("")}</div>`;
}
function koppla() {
  const on = (s, fn) => { const el = $(s); if (el) el.onclick = fn; };
  document.querySelectorAll("[data-synka]").forEach((b) => b.onclick = () => andra({ op: "synka", id: b.dataset.synka }, "Synkat."));
  document.querySelectorAll("[data-bort]").forEach((b) => b.onclick = () => confirm("Ta bort eleven från listan?") && andra({ op: "elev_bort", id: b.dataset.bort }));
  on("#synka-alla", () => andra({ op: "synka_alla" }, "Alla är synkade."));
  document.querySelectorAll("[data-inst]").forEach((b) => b.onchange = () => andra({ op: "installningar", [b.dataset.inst]: b.checked }));
  on("#i-spara", () => andra({ op: "installningar", klass: $("#i-klass").value, larare: $("#i-larare").value }, "Sparat."));
  document.querySelectorAll("[data-vb-bort]").forEach((b) => b.onclick = () => confirm("Ta bort veckobrevet?") && andra({ op: "veckobrev_bort", id: b.dataset.vbBort }));
  on("#vb-skicka", () => {
    const rader = (id) => $(id).value.split("\n").map((x) => x.trim()).filter(Boolean);
    const glosor = rader("#vb-glosor").map((x) => x.split(/\s*=\s*/)).filter((p) => p.length === 2 && p[0] && p[1]);
    const ai = { kapitel: $("#vb-kap").value ? Number($("#vb-kap").value) : null, kapitel_namn: $("#vb-kapnamn").value || null,
      las_dagar: [...document.querySelectorAll("[data-las]")].filter((x) => x.checked).map((x) => Number(x.dataset.las)),
      hoglasning: $("#vb-hogl").checked, skriv_dag: $("#vb-skriv").value === "" ? null : Number($("#vb-skriv").value),
      ord: rader("#vb-ord"), glosor, glosor_sprak: glosor.length ? [$("#vb-fran").value, $("#vb-till").value] : null,
      diktamen_dag: $("#vb-dikt").value === "" ? null : Number($("#vb-dikt").value), regler: rader("#vb-regler"), note: $("#vb-note").value };
    andra({ op: "veckobrev", titel: $("#vb-titel").value, vecka: $("#vb-vecka").value, ai, fil: filer.vb }, "Veckobrevet är utlagt. Det skickas när eleverna synkar.").then((ok) => { if (ok) { delete filer.vb; rita(); } });
  });
  ["vb", "pr", "mt"].forEach((id) => { const el = $(`#${id}-fil`); if (el) el.onchange = () => laddaUpp(id, el); });
  document.querySelectorAll("[data-fil-bort]").forEach((b) => b.onclick = () => { delete filer[b.dataset.filBort]; rita(); });
  document.querySelectorAll("[data-elev]").forEach((b) => b.onclick = () => { valdElev = b.dataset.elev; rita(); });
  on("#st-tillbaka", () => { valdElev = null; rita(); });
  document.querySelectorAll("[data-prov]").forEach((b) => b.onclick = (ev) => { if (ev.target.closest("button")) return; valtProv = b.dataset.prov; rita(); });
  on("#pr-tillbaka", () => { valtProv = null; rita(); });
  document.querySelectorAll("[data-mat-bort]").forEach((b) => b.onclick = () => confirm("Ta bort? Det som redan har kommit fram till eleverna ligger kvar där.") && andra({ op: "material_bort", id: b.dataset.matBort }));
  on("#pr-ny", async () => {
    if (await andra({ op: "material_ny", typ: "prov", titel: $("#pr-titel").value, amne: $("#pr-amne").value, datum: $("#pr-datum").value, max: $("#pr-max").value, text: $("#pr-text").value, fil: filer.pr }, "Provet är inlagt. Tryck på det för att skriva in resultaten.")) { delete filer.pr; valtProv = L.material.find((m) => m.typ === "prov")?.id || null; rita(); }
  });
  document.querySelectorAll("[data-res-spara]").forEach((b) => b.onclick = () => {
    const e = b.dataset.resSpara, po = $(`[data-res-po="${e}"]`), be = $(`[data-res-be="${e}"]`);
    andra({ op: "prov_resultat", id: valtProv, elev: e, poang: po ? po.value : "", betyg: be ? be.value : "", kommentar: $(`[data-res-ko="${e}"]`).value }, "Sparat. Det skickas när eleven synkar.");
  });
  on("#rl-ny", async () => {
    if (await andra({ op: "material_ny", typ: "riktlinje", titel: "Riktlinje", amne: $("#rl-amne").value, text: $("#rl-text").value,
      till: [...document.querySelectorAll("[data-rl-till]")].filter((x) => x.checked).map((x) => x.dataset.rlTill) }, "Riktlinjen skickas när eleverna synkar. Föräldern godkänner den.")) rita();
  });
  on("#mt-ny", async () => {
    if (await andra({ op: "material_ny", typ: $("#mt-schema").checked ? "schema" : "material", titel: $("#mt-titel").value || ($("#mt-schema").checked ? "Schema" : ""), amne: $("#mt-amne").value, text: $("#mt-text").value, fil: filer.mt,
      till: [...document.querySelectorAll("[data-mt-till]")].filter((x) => x.checked).map((x) => x.dataset.mtTill) }, "Materialet skickas när eleverna synkar.")) { delete filer.mt; rita(); }
  });
  on("#g-dela", () => andra({ op: "grupp_dela", antal: $("#g-antal").value, uppgift: $("#g-uppgift").value, datum: $("#g-datum").value }, "Grupperna är skapade."));
  on("#g-ny", () => andra({ op: "grupp_ny", namn: $("#g-namn").value, uppgift: $("#g-uppgift").value, datum: $("#g-datum").value,
    medlemmar: [...document.querySelectorAll("[data-gm]")].filter((x) => x.checked).map((x) => x.dataset.gm) }, "Gruppen är skapad."));
  document.querySelectorAll("[data-g-avsluta]").forEach((b) => b.onclick = () => {
    const a = prompt("Avsluta gruppen. Vill du skriva en anteckning till historiken?", "");
    if (a !== null) andra({ op: "grupp_avsluta", id: b.dataset.gAvsluta, anteckning: a }, "Gruppen är avslutad och sparad i historiken.");
  });
  on("#kp-lagg", () => andra({ op: "klassplugg", poang: Number($("#kp-poang").value) }, "Tillagt."));
  on("#h-spara", () => $("#h-text").value.trim() && andra({ op: "anteckning", text: $("#h-text").value }, "Anteckningen är sparad."));
  const sok = $("#h-sok");
  if (sok) sok.oninput = () => document.querySelectorAll("#h-tabell tr").forEach((tr) => { tr.style.display = tr.textContent.toLowerCase().includes(sok.value.toLowerCase()) ? "" : "none"; });
}
ladda();
setInterval(() => { if (["oversikt", "klasslag", "rapporter", "statistik"].includes(flik) && !document.querySelector("input:focus,textarea:focus")) ladda(); }, 15000);
</script></body></html>
