<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Läxspelet Lärare</title><link rel="icon" href="/ikon.png">
<style>
:root{--bg:#f4f5fb;--kort:#fff;--text:#1c2340;--muted:#6b7190;--acc:#3949ab;--rand:#dfe2f0;--ok:#2e7d32;--fel:#c62828}
@media (prefers-color-scheme: dark){:root{--bg:#141726;--kort:#1f2338;--text:#e8eaf6;--muted:#9aa0bf;--acc:#7986cb;--rand:#2e3352}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--acc);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;flex:1}
nav{padding:10px 20px;background:var(--kort);border-bottom:1px solid var(--rand);font-weight:700;font-size:16px}
.meny-knapp{margin-left:auto;background:rgba(255,255,255,.2);color:inherit;border:none;border-radius:16px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.meny-bak{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.25)}
.meny{position:fixed;top:58px;right:10px;z-index:21;display:flex;flex-direction:column;background:var(--kort);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:auto;max-height:calc(100vh - 80px);min-width:240px}
.meny-grupp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 18px 2px;border-top:1px solid var(--rand)}
.meny button{background:none;border:none;text-align:left;padding:12px 18px;font-size:15px;color:var(--text);cursor:pointer}.meny button:hover{background:var(--bg)}.meny button.vald{font-weight:700;color:var(--acc)}
main{max-width:1000px;margin:auto;padding:16px}
.kort{background:var(--kort);border:1px solid var(--rand);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}
input,textarea,select{font:inherit;padding:8px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
textarea{min-height:90px}label{display:block;margin:8px 0 2px;font-size:14px}
button.p{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-size:15px;cursor:pointer;margin-top:10px}
button.m{background:none;border:1px solid var(--rand);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--rand);font-size:14px;vertical-align:top}
.adress{font-size:30px;font-weight:800;letter-spacing:1px}.qr{width:180px;height:180px;background:#fff;padding:6px;border-radius:10px}
.flex{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:14px;background:var(--rand);border-radius:7px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#e53935,#ff7043)}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:auto}
.dagar{display:flex;gap:10px;flex-wrap:wrap}.dagar label{display:flex;gap:4px;align-items:center;margin:0}.dagar input{width:auto}
.msg{padding:10px;border-radius:9px;margin-bottom:12px}.msg.fel{background:#ffebee;color:var(--fel)}.msg.ok{background:#e8f5e9;color:var(--ok)}
.grupp{border-left:4px solid var(--acc);padding-left:10px;margin:10px 0}
.staplar{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0 2px}.staplar div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.staplar-txt{display:flex;gap:6px}.staplar-txt span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.mini-bar{display:inline-block;width:70px;height:8px;background:var(--rand);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.mini-bar i{display:block;height:100%;background:var(--acc)}
.fil-rad{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.fil-rad input{width:auto}
tr.klick{cursor:pointer}tr.klick:hover td{background:var(--bg)}td input{padding:5px}.res-in{width:80px}
h3{font-size:16px;margin:0 0 6px}.badge{background:var(--fel);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.rutor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.ruta{background:var(--bg);border-radius:12px;padding:12px}.ruta-r{font-size:13px;color:var(--muted)}.ruta-v{font-size:28px;font-weight:800;margin:2px 0}.ruta-u{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}.legend span{display:flex;align-items:center;gap:6px}
.lg-bar{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--acc)}.lg-line{display:inline-block;width:16px;height:2px;background:var(--text)}
.vd-yta{position:relative;height:150px;display:flex;gap:6px;align-items:flex-end;margin-left:20px;border-bottom:1px solid var(--rand)}
.vd-grid{position:absolute;left:0;right:0;border-top:1px dashed var(--rand)}.vd-grid span{position:absolute;left:-20px;top:-8px;font-size:11px;color:var(--muted)}
.vd-kol{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
.vd-bar{width:70%;max-width:40px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.vd-snitt{position:absolute;left:8%;right:8%;height:2px;background:var(--text);box-shadow:0 0 0 2px var(--kort)}
.vd-x{display:flex;gap:6px;margin-left:20px}.vd-x span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
.lb{display:flex;flex-direction:column;gap:6px}.lb-rad{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px}
.lb-rad.klick{cursor:pointer}.lb-rad.klick:hover .lb-namn{text-decoration:underline}.lb-namn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-spar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.lb-spar i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.lb-v{font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}a.m{text-decoration:none;display:inline-block}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--text);color:var(--kort);font-size:13px;padding:6px 9px;border-radius:8px;max-width:280px;display:none}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><img src="/ikon.png" width="32" height="32" alt=""><h1 id="rubrik">Läxspelet Lärare</h1><span id="ver" class="small"></span><button class="meny-knapp" id="meny-knapp" title="Meny">☰ Meny</button></header>
<nav id="nav"></nav><main id="main"></main>
<script>
// Samma menysystem som i Läxspelet: ☰ Meny öppnar en lista i grupper
const MENY = [[null, ["oversikt"]], ["Eleverna", ["statistik", "studieteknik", "rapporter", "foraldrar"]], ["Skicka till klassen", ["veckobrev", "prov", "material"]],
  ["Klassen", ["grupper", "klasslag"]], ["Skolan", ["skolan"]], ["Övrigt", ["historik", "inst"]]];
let menyOppen = false;
// Hovra (eller tryck) på en stapel för att se siffrorna
document.addEventListener("pointerover", (ev) => { const m = ev.target.closest?.("[data-tip]"); const tip = document.getElementById("tip") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "tip" }));
  if (!m) { tip.style.display = "none"; return; } tip.textContent = m.dataset.tip; tip.style.display = "block"; });
document.addEventListener("pointermove", (ev) => { const tip = document.getElementById("tip"); if (tip?.style.display === "block") { tip.style.left = Math.min(ev.clientX + 12, innerWidth - 290) + "px"; tip.style.top = (ev.clientY + 14) + "px"; } });
const flikar = [["oversikt", "🏫 Översikt"], ["statistik", "📈 Statistik"], ["studieteknik", "🧠 Studieteknik"], ["veckobrev", "📬 Veckobrev"], ["prov", "📝 Prov"], ["material", "📎 Material"], ["grupper", "👥 Grupper"], ["klasslag", "🐲 Klasslag"], ["rapporter", "📊 Rapporter"], ["foraldrar", "✉️ Från föräldrar"], ["historik", "📜 Historik"], ["skolan", "🏫 Skolan"], ["inst", "⚙️ Inställningar"]];
let valdElev = null, valtProv = null, filer = {}, forraFlik = "oversikt";
const VD = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
let L = null, flik = location.hash.slice(1) || "oversikt", msg = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (s) => document.querySelector(s);
async function ladda() { L = await (await fetch("/api/lage")).json(); rita(); }
async function uppdatera(body, ok) {
  const r = await fetch("/api/uppdatering", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) msg = { t: "fel", x: j.fel || "Det gick inte." }; else { L.uppdatering = j; msg = ok ? { t: "ok", x: ok } : null; }
  rita();
}
// Ny version: en rad överst på alla sidor
function uppdRad() {
  const u = L.uppdatering, w = L.windows;
  const brand = w && w.windows && !w.brandvagg ? `<div class="msg fel">⚠️ Eleverna kan inte ansluta än: Windows brandvägg behöver öppnas för appen (en gång). <button class="m" id="u-brand">🔓 Öppna brandväggen</button><div class="small">Windows frågar ”Vill du tillåta…”. Har du inte administratörsrätt på datorn: be IT trycka på knappen.</div></div>` : "";
  const klar = u?.uppdaterad ? `<div class="msg ok">✅ Läxspelet Lärare är uppdaterad till version ${esc(u.uppdaterad.till)}. <button class="m" id="u-ok">OK</button></div>` : "";
  return brand + klar + uppdRad2(u);
}
function uppdRad2(u) {
  if (!u?.ny) return "";
  if (u.steg) return `<div class="msg ok">⏳ ${u.steg === "laddar" ? "Laddar ner" : "Installerar"} version ${esc(u.senaste)}… Appen startar om själv om en liten stund.</div>`;
  return `<div class="msg ok">🆕 Version ${esc(u.senaste)} av Läxspelet Lärare finns. ${u.lage === "automatisk" ? "Den installeras automatiskt när appen inte används, eller nu: " : ""}
    ${u.kan_installera ? `<button class="m" id="u-nu">⬇️ Uppdatera nu</button>` : `<a href="${esc(u.sida)}" target="_blank">Ladda ner</a>`}</div>`;
}
async function andra(body, ok) {
  const r = await fetch("/api/andra", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { msg = { t: "fel", x: j.fel || "Det gick inte." }; } else { L = { ...j, uppdatering: j.uppdatering ?? L.uppdatering }; msg = ok ? { t: "ok", x: ok } : null; }
  rita();
  return r.ok;
}
function rita() {
  $("#ver").textContent = "v" + L.version;
  $("#rubrik").textContent = L.klass ? `Läxspelet Lärare · ${L.klass}` : "Läxspelet Lärare";
  const namn = Object.fromEntries(flikar);
  if (flik === "elev" && !valdElev) flik = "oversikt";
  $("#nav").textContent = flik === "elev" ? `👤 ${(L.elever.find((x) => x.id === valdElev) || {}).namn || "Elev"}` : namn[flik] || namn.oversikt;
  document.querySelector(".meny-bak")?.remove(); document.querySelector(".meny")?.remove();
  if (menyOppen) document.body.insertAdjacentHTML("beforeend", `<div class="meny-bak"></div><div class="meny">${MENY.map(([rubrik, ids]) =>
    (rubrik ? `<div class="meny-grupp">${rubrik}</div>` : "") + ids.map((id) => `<button class="${id === flik ? "vald" : ""}" data-f="${id}">${namn[id]}${id === "skolan" && L.skola?.olasta ? ` (${L.skola.olasta})` : ""}</button>`).join("")).join("")}</div>`);
  $("#meny-knapp").textContent = `☰ Meny${L.skola?.olasta ? ` (${L.skola.olasta})` : ""}`;
  $("#meny-knapp").onclick = () => { menyOppen = !menyOppen; rita(); };
  const bak = document.querySelector(".meny-bak"); if (bak) bak.onclick = () => { menyOppen = false; rita(); };
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { flik = b.dataset.f; location.hash = flik; msg = null; menyOppen = false; rita(); window.scrollTo(0, 0); });
  $("#main").innerHTML = uppdRad() + (msg ? `<div class="msg ${msg.t}">${esc(msg.x)}</div>` : "") + ({ oversikt, statistik, elev, studieteknik, veckobrev, prov, material, grupper, klasslag, rapporter, foraldrar, skolan, historik, inst }[flik] || oversikt)();
  koppla();
}
const av = (k) => L.inst[k] ? "" : `<div class="msg fel">Den här funktionen är avstängd. Slå på den under ⚙️ Inställningar.</div>`;
function oversikt() {
  const f = (e) => Object.entries(e.foralder || {}).filter(([, v]) => v).map(([k]) => ({ veckobrev: "📬", rapport: "📊", klasslag: "🏫", mejl: "📧", grupper: "👥", statistik: "📈", material: "📎", schema: "🗓️", studieteknik: "🧠", riktlinjer: "📝", lapp: "✉️", samtal: "🗣️" })[k]).join(" ");
  return `<div class="kort flex"><img class="qr" src="/api/qr.svg" alt="QR-kod">
    <div>${L.skola ? `<p class="small muted">🏫 ${esc(L.skola.namn)} · ${L.roll === "amne" ? `ämneslärare${L.amne ? ` i ${esc(L.amne)}` : ""}` : `mentor${L.klass ? ` för ${esc(L.klass)}` : ""}`}</p>` : ""}<h2>Eleverna ansluter här</h2><div class="adress">${esc(L.adress)}</div>
    <p class="muted">Eleverna ska vara på samma wifi som datorn. I Läxspelet trycker de <b>🤝 Plugga ihop → 🏫 Anslut till läraren</b> och skriver adressen.
    Nästa gång räcker <b>🔄 Synka med läraren</b>.</p><p class="small muted">Föräldern bestämmer också: en funktion fungerar bara när både du och föräldern har slagit på den.</p></div></div>
  <div class="kort"><h2>Elever (${L.elever.length})</h2>
    ${L.elever.length ? `<table><tr><th>Namn</th><th>Senast synkad</th><th>Föräldern har slagit på</th><th></th></tr>
    ${L.elever.map((e) => `<tr><td><a href="#" data-elev="${e.id}"><b>${esc(e.namn)}</b></a>${e.fel ? `<div class="small" style="color:var(--fel)">⚠️ ${esc(e.fel)}</div>` : ""}</td><td>${esc(e.senast || "–")}</td><td>${f(e) || "<span class='muted'>inget</span>"}</td>
      <td>${e.har_schema ? `<a class="m" href="/schema/${encodeURIComponent(e.id)}" target="_blank" title="Digitalt schema, sök och skriv ut">🗓️</a> ` : ""}<button class="m" data-synka="${e.id}">🔄</button> <button class="m" data-bort="${e.id}">🗑️</button></td></tr>`).join("")}</table>
    <button class="p" id="synka-alla">🔄 Synka alla</button>` : `<p class="muted">Inga elever har anslutit än.</p>`}</div>`;
}
function veckobrev() {
  return `${av("veckobrev")}<div class="kort"><h2>Nytt veckobrev</h2>
    <p class="small muted">Veckobrevet hamnar i föräldrarnas inkorg när eleven synkar. Föräldern godkänner innan läxorna läggs in.</p>
    <div class="grid2"><div><label>Rubrik</label><input id="vb-titel" placeholder="Veckobrev v.${L.boss?.vecka?.slice(-2) || ""}"></div>
      <div><label>Vecka</label><input id="vb-vecka" placeholder="t.ex. 2026-W48"></div></div>
    <h3>📖 Läsläxa</h3><div class="grid2"><div><label>Kapitel (nummer)</label><input id="vb-kap" type="number"></div><div><label>Kapitlets namn</label><input id="vb-kapnamn"></div></div>
    <label>Läsdagar</label><div class="dagar">${VD.slice(0, 5).map((d, i) => `<label><input type="checkbox" data-las="${i}"> ${d}</label>`).join("")}</div>
    <div class="chk"><input type="checkbox" id="vb-hogl"> <span>Läses högt för en vuxen</span></div>
    <label>Läxboken lämnas in</label><select id="vb-skriv"><option value="">Ingen</option>${VD.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
    <h3>📝 Ord och glosor</h3>
    <label>Stavningsord (ett per rad)</label><textarea id="vb-ord"></textarea>
    <label>Glosor med översättning (ett par per rad: <i>hund = dog</i>)</label><textarea id="vb-glosor"></textarea>
    <div class="grid2"><div><label>Från språk</label><input id="vb-fran" value="Svenska"></div><div><label>Till språk</label><input id="vb-till" value="Engelska"></div></div>
    <label>Förhör/diktamen</label><select id="vb-dikt"><option value="">Inget</option>${VD.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
    <label>Instruktioner (en per rad)</label><textarea id="vb-regler"></textarea>
    <label>Övrigt till föräldrarna</label><input id="vb-note">
    <h3>📎 Har du redan brevet som PDF eller foto?</h3>
    <p class="small muted">Bifoga det. Föräldern får brevet, och familjens Läxspelet läser det och fyller i läxorna du inte skrev ovan. Du kan alltså bara bifoga brevet och ge det en rubrik.</p>
    ${filVal("vb")}
    <button class="p" id="vb-skicka">📬 Lägg ut veckobrevet</button></div>
  <div class="kort"><h2>Utlagda veckobrev</h2>${L.veckobrev.length ? `<table>${L.veckobrev.map((b) => `<tr><td><b>${esc(b.titel)}</b>${b.fil ? ` ${filLank(b.fil)}` : ""}<div class="small muted">v.${esc(b.vecka)} · ${esc(b.skapad)}</div></td><td>${(b.ai.ord || []).length} ord</td><td class="small">${fatt(L.veckobrev_fatt?.[b.id])}</td><td><button class="m" data-vb-bort="${b.id}">🗑️</button></td></tr>`).join("")}</table>` : `<p class="muted">Inga än.</p>`}</div>`;
}
const filLank = (f) => `<a href="/api/fil/${esc(f.namn)}" target="_blank">${f.mime === "application/pdf" ? "📄" : "🖼️"} ${esc(f.orig || "fil")}</a>`;
const fatt = (n) => n?.length ? `✅ Har kommit fram till ${n.length}: <span class="muted">${n.map(esc).join(", ")}</span>` : `<span class="muted">⏳ Skickas när eleverna synkar</span>`;
function filVal(id) {
  const f = filer[id];
  return `<div class="fil-rad"><input type="file" id="${id}-fil" accept="application/pdf,image/*">${f ? `<span>✅ ${filLank(f)} <button class="m" data-fil-bort="${id}">✖</button></span>` : `<span class="small muted">PDF eller foto, högst 8 MB</span>`}</div>`;
}
// Gör stora foton mindre innan de laddas upp (telefonbilder är ofta 5–10 MB).
async function krymp(fil) {
  if (!fil.type.startsWith("image/") || fil.size < 1500000) return fil;
  const bild = await createImageBitmap(fil);
  const s = Math.min(1, 2000 / Math.max(bild.width, bild.height));
  const c = Object.assign(document.createElement("canvas"), { width: Math.round(bild.width * s), height: Math.round(bild.height * s) });
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  return new File([blob], fil.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function laddaUpp(id, input) {
  const fil = input.files[0];
  if (!fil) return;
  const fd = new FormData();
  fd.append("fil", await krymp(fil));
  const r = await fetch("/api/fil", { method: "POST", body: fd });
  const j = await r.json();
  if (!r.ok) msg = { t: "fel", x: j.fel || "Det gick inte att ladda upp." };
  else { filer[id] = j; msg = null; }
  rita();
}
// ---------- Statistik: hela klassen och elevkortet (samma diagram) ----------
const S = {
  snitt: (s) => { const f = s?.forhor || []; const n = f.reduce((a, x) => a + x.n, 0); return n ? Math.round(f.reduce((a, x) => a + x.ratt, 0) / n * 100) : null; },
  sista: (s) => (s?.per_vecka || []).slice(-1)[0]?.dagar ?? 0,
  fyra: (s) => (s?.per_vecka || []).slice(-4).reduce((a, x) => a + x.dagar, 0),
  provPct: (p) => ("max" in p && p.max ? Math.round(p.poang / p.max * 100) : ({ A: 100, B: 90, C: 80, D: 70, E: 60, F: 0 })[String(p.betyg).toUpperCase()] ?? null),
  LAG: 1.5, // under så många pluggdagar i veckan (senaste 4 veckorna) markeras eleven
};
// Klassens snitt per vecka (bara elever som delar statistik)
function klassVeckor() {
  const med = L.elever.filter((e) => e.statistik?.per_vecka?.length);
  if (!med.length) return [];
  const veckor = med[0].statistik.per_vecka.map((v) => v.vecka);
  return veckor.map((v) => { const x = med.map((e) => e.statistik.per_vecka.find((y) => y.vecka === v)?.dagar).filter((d) => d !== undefined);
    return { vecka: v, dagar: x.length ? x.reduce((a, b) => a + b, 0) / x.length : 0 }; });
}
const tal = (x, d = 1) => (x === null || x === undefined ? "–" : Number(x).toFixed(d).replace(".", ",").replace(/,0$/, ""));

const veckaAv = (d) => { const t = new Date(d + "T12:00"); if (isNaN(t)) return ""; const x = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())); const dag = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - dag); const ar = x.getUTCFullYear(); return `${ar}-v${Math.ceil(((x - Date.UTC(ar, 0, 1)) / 864e5 + 1) / 7)}`; };
// Krockar i provkalendern: samma klass, samma dag (2+) eller samma vecka (3+)
function provKrockar(lista) {
  const ut = [], idag = new Date().toISOString().slice(0, 10);
  const per = {};
  lista.filter((x) => x.datum >= idag).forEach((x) => { const k = (x.klass || "?").toUpperCase(); (per[k] = per[k] || []).push(x); });
  for (const [klass, p] of Object.entries(per)) {
    const dag = {}, vecka = {};
    p.forEach((x) => { (dag[x.datum] = dag[x.datum] || []).push(x); (vecka[veckaAv(x.datum)] = vecka[veckaAv(x.datum)] || []).push(x); });
    Object.entries(dag).forEach(([d, x]) => x.length >= 2 && ut.push({ klass, text: `${x.length} prov samma dag (${d})`, prov: x }));
    Object.entries(vecka).forEach(([v, x]) => x.length >= 3 && ut.push({ klass, text: `${x.length} prov samma vecka (${v.split("-")[1]})`, prov: x }));
  }
  return ut;
}
