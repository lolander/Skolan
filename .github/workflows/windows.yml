name: Windowsappen

on:
  push:
    branches: [main]
    paths: ["fristaende/**", "custom_components/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install -r fristaende/requirements.txt pyinstaller

      - name: Bygg Skolan.exe
        working-directory: fristaende
        run: pyinstaller --noconfirm windows/skolan.spec

      - name: Provkör appen
        run: python fristaende/windows/provkor.py fristaende/dist/Skolan/Skolan.exe

      - name: Bygg installationsprogrammet
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content custom_components/skolan/manifest.json | ConvertFrom-Json).version
          & $iscc "/DVERSION=$version" fristaende/windows/skolan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Kodsignering, gratis för öppen källkod via SignPath Foundation (se docs/kodsignering.md).
      - name: Ladda upp för signering
        id: osignerad
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: osignerad-laxspelet
          path: fristaende/windows/Output/*.exe

      - name: Signera (SignPath Foundation)
        if: steps.osignerad.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT || 'Skolan' }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: laxspelet
          github-artifact-id: ${{ steps.osignerad.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: fristaende/windows/Signerad

      - name: Använd den signerade filen
        if: steps.osignerad.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item fristaende/windows/Signerad/*.exe fristaende/windows/Output/ -Force
          Get-ChildItem fristaende/windows/Output/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid') { Write-Error "Signaturen är inte giltig: $($s.Status)"; exit 1 }
            Write-Host "✓ signerad av $($s.SignerCertificate.Subject)"
          }

      - name: Fingeravtryck
        shell: pwsh
        run: |
          # Appen installerar bara filer som stämmer med fingeravtrycket (räknas efter signeringen)
          Get-ChildItem fristaende/windows/Output/*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Out-File -Encoding ascii -NoNewline ($_.FullName + ".sha256")
          }

      - name: Provinstallera tyst per användare (som en automatisk uppdatering)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem fristaende/windows/Output/*.exe)[0].FullName
          # Vänta bara på installationsprogrammet (inte appen som det startar efteråt)
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Error "Installationen tog för lång tid"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Installationen misslyckades ($($p.ExitCode))"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Laxspelet\Skolan.exe'
          if (-not (Test-Path $exe)) { Write-Error "Installerades inte per användare: $exe"; exit 1 }
          Write-Host "✓ installerad i $exe"
          Start-Sleep -Seconds 5
          Get-Process Skolan -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:PROVKOR_UTAN_TUNNEL = "1"
          python fristaende/windows/provkor.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne (Get-Content "$setup.sha256").Split(' ')[0]) { Write-Error "Fingeravtrycket stämmer inte"; exit 1 }
          Write-Host "✓ fingeravtrycket stämmer"

      - uses: actions/upload-artifact@v4
        with:
          name: Skolan-Setup
          path: fristaende/windows/Output/*

      - name: Bygg Microsoft Store-paketet (MSIX)
        shell: pwsh
        env:
          STORE_NAMN: ${{ vars.STORE_NAMN }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAMN: ${{ vars.STORE_PUBLISHER_NAMN }}
        run: |
          $version = (Get-Content custom_components/skolan/manifest.json | ConvertFrom-Json).version
          python fristaende/windows/msix_bygg.py fristaende/dist/Skolan $version fristaende/windows/Store

      - uses: actions/upload-artifact@v4
        with:
          name: Laxspelet-Store
          path: fristaende/windows/Store/*.msix

      # Fasta namn så att länken .../releases/latest/download/Laxspelet-Setup.exe alltid ger senaste versionen,
      # och den senaste lärarappen följer med, så att båda finns på samma sida.
      - name: Fasta filnamn och senaste lärarappen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ut = "fristaende/windows/Output"
          Copy-Item (Get-ChildItem "$ut/Skolan-Setup-*.exe")[0].FullName "$ut/Laxspelet-Setup.exe"
          $tag = gh release list --repo ${{ github.repository }} --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("larare-v"))][0].tagName'
          if ($tag) {
            gh release download $tag --repo ${{ github.repository }} --pattern "Skolan-Larare-Setup-*" --dir $ut
            # IT-paketet och komponentlistan följer också med (finns från lärarappen 0.11.0)
            gh release download $tag --repo ${{ github.repository }} --pattern "Laxspelet-Larare-IT.zip" --pattern "Laxspelet-Larare-SBOM-*" --dir $ut 2>$null
            $global:LASTEXITCODE = 0
            $l = Get-ChildItem "$ut/Skolan-Larare-Setup-*.exe" | Select-Object -First 1
            if ($l) { Copy-Item $l.FullName "$ut/Laxspelet-Larare-Setup.exe"; Write-Host "✓ lärarappen $tag följer med" }
          }

      - name: Publicera (vid ny version-tagg)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fristaende/windows/Output/*.exe
            fristaende/windows/Output/*.sha256
            fristaende/windows/Output/*.zip
            fristaende/windows/Output/*.cdx.json
          prerelease: false
          body: |
            ## 📚 Läxspelet för Windows
            **Familjer:** ladda ner **[Laxspelet-Setup.exe](https://github.com/lolander/Skolan/releases/latest/download/Laxspelet-Setup.exe)**, öppna filen och följ installationen. Läxor och inställningar finns kvar om du uppdaterar, och appen uppdaterar sig själv.

            **Lärare:** ladda ner **[Laxspelet-Larare-Setup.exe](https://github.com/lolander/Skolan/releases/latest/download/Laxspelet-Larare-Setup.exe)** (Läxspelet Lärare). Den installeras på din egen dator, utan administratör, och uppdaterar sig själv.

            **Skolor, IT och dataskyddsombud:** [Information till skolor](https://github.com/lolander/Skolan/blob/main/docs/larare-skolor.md) · [Kom igång på nivå 0 (en sida)](https://github.com/lolander/Skolan/blob/main/docs/larare-niva0.md) · [Prova lärarappen utan att installera](https://lolander.github.io/Skolan/demo/) · IT-paket och komponentlista finns bland filerna nedan.

            ### Varnar Windows?
            Om installationsfilen inte är kodsignerad, eller signaturen är ny, kan Windows visa *”Windows har skyddat datorn”*. Det är normalt för nya, små appar.
            Tryck **Mer information** och sedan **Kör ändå**:

            ![Så installerar du: Mer information → Kör ändå](https://raw.githubusercontent.com/lolander/Skolan/main/docs/installera-windows.svg)

            Koden är öppen och finns här på GitHub, och installationsfilen byggs automatiskt av GitHub från koden.
